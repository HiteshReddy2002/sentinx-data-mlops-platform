name: SentinX CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Dependencies
        run: uv sync

      - name: Run Data Pipeline Orchestrator
        run: uv run python -m src.pipeline.orchestrator

      - name: Run ML Training & Registry
        run: uv run python -m src.ml.train

      - name: Run Drift Monitor
        run: uv run python -m src.ml.drift_monitor

      - name: Run Automated Test Suite
        run: uv run pytest -v
